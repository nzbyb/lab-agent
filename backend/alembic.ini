# Alembic configuration.
#
# ---------------------------------------------------------------------------
# KEEP THIS FILE PURE ASCII. No Chinese, no accented characters, nothing.
#
# Alembic reads this file with `encoding="locale"` (see alembic/util/compat.py,
# read_config_parser). On a Chinese Windows the locale encoding is GBK, so any
# non-ASCII byte here raises UnicodeDecodeError and *every* alembic command
# dies before it starts. On a Linux container the locale is UTF-8, so the same
# file works there - which is exactly what makes this painful: it breaks on
# Windows only. The Chinese explanation lives in migrations/README.md instead,
# next to the rest of the project's notes. (.py files are fine - Python reads
# source as UTF-8 by default.)
# ---------------------------------------------------------------------------
#
# sqlalchemy.url below is a PLACEHOLDER and is always overridden by
# migrations/env.py, which takes the real URL from app.config.settings.
# Keeping one source of truth (backend/.env) means the .env and this file can
# never drift apart - and this file is committed to a public repo, so it must
# never contain a real connection string.

[alembic]
script_location = %(here)s/migrations

# Lets the alembic CLI `import app` when run from the backend/ directory.
prepend_sys_path = .

# Migration filenames look like 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# Encoding used when writing migration scripts. The project's comments are in
# Chinese, which needs UTF-8; without this some Windows environments write GBK.
output_encoding = utf-8

# Placeholder - see the note above.
sqlalchemy.url = driver://user:pass@localhost/dbname


# ---------------------------------------------------------------------------
# Logging. Only takes effect when alembic runs from the CLI: env.py skips
# fileConfig() when the app calls Alembic in-process, because fileConfig's
# default disable_existing_loggers=True would silence uvicorn's loggers.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
