# ============================================================
# 智能实验室预约系统 —— 四件套一键起：MySQL + Redis + 后端 + 前端
#
# 起之前先做两件事：
#   1) cp .env.example .env   然后把里面的值填上
#      （.env 已被 .gitignore 忽略，绝不会进仓库）
#   2) 确认 Docker Desktop 在跑
#
# 然后：
#   docker compose up -d --build      构建并后台启动
#   docker compose ps                 看三个容器的状态
#   docker compose logs -f backend    跟后端日志
#   浏览器开 http://localhost:8080
#
# 停：
#   docker compose down               停掉（数据留在卷里，下次还在）
#   docker compose down -v            连数据一起清掉，回到全新状态
#
# ------------------------------------------------------------
# 起来之后库是空的——建表是后端启动时自动做的，但没有数据。
# 想灌演示数据 + 注册一个账号，在第一次 up 之后跑：
#
#   bash scripts/init-demo.sh --username <账号名> --admin
#
# 注意 demo_data.sql 和 seed_demo_data.py 都只碰数据、**不建任何用户**（刻意的，
# 免得仓库里出现默认账号密码），所以账号名和密码必须由使用者传进脚本。
# 只想灌实验室和设备的话，也可以直接执行 backend/demo_data.sql：
#
#   docker compose exec -T mysql sh -c \
#     'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" --default-character-set=utf8mb4 lab_agent' \
#     < backend/demo_data.sql
# ============================================================

name: lab-agent

services:
  # ------------------------------------------------------------
  # 数据库
  # ------------------------------------------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # :? 的意思是"没设就直接报错退出"，别让它偷偷用个默认空密码起来。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?根目录 .env 里没填 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lab_agent
      TZ: ${TZ:-Asia/Shanghai}
    command:
      # 必须显式指定。MySQL 镜像默认字符集是 latin1，中文存进去会变成问号，
      # 而且是写入那一刻才炸、报错还不知所云。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 只绑 127.0.0.1（外网连不进来），且用宿主机的 3307 而不是 3306
      # —— 3306 要留给本机自己的 MySQL，抢了的话你本机那份就跑不起来了。
      # 想用 Navicat 之类连进来看数据，就连 127.0.0.1:3307。
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 后端必须等数据库真的能连了再起，否则第一次跑必定崩在"连不上数据库"。
      # 光看容器"Up"没用 —— MySQL 第一次启动要初始化数据目录，几十秒才能用。
      # 用 CMD-SHELL 加 $$ 是为了让容器里的 shell 去展开 $MYSQL_ROOT_PASSWORD，
      # 而不是在 docker compose 这一层就被替换掉（那样密码含特殊字符就会出错）。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------
  # 限流计数器
  #
  # 只存限流计数，丢了不影响业务（最坏是额度临时重置），所以不挂卷、
  # 关掉持久化，也不对外开端口——只有 compose 网络里的 backend 能访问。
  #
  # ⚠️ 服务器上 Docker Hub 连不上时，这个镜像从 public.ecr.aws 拉再改名，
  #    做法见 README「国内网络下的三个坑」（跟 python/node 镜像是同一招）。
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --save "" 关掉 RDB 快照，--appendonly no 关掉 AOF：计数本来就不需要持久化
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      # 只是观察用：`docker compose ps` 里能看到 healthy / unhealthy。
      # 它**不参与任何决策**——backend 不等它（见下面的 depends_on），
      # Docker 也不会因为 unhealthy 去重启容器（restart 只看进程退没退出）。
      # Redis "进程在但不回话"时不会自愈，只会降级成进程内存计数。
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # 数据库迁移（一次性）
  #
  # 单独跑 `python -m app.migrate`，跑完就退出。backend 通过
  # depends_on.condition: service_completed_successfully 等它返回 0 才启动。
  #
  # 为什么不在 backend 的 lifespan 里建表：
  #   - 多 worker / 多副本同时启动时，每个进程都会跑一遍 DDL，容易撞车；
  #   - 迁移失败时 backend 会反复重启、日志被 ALTER 报错刷屏，
  #     而这里失败会让 `docker compose up` 直接报错，看得见是哪一步挂的。
  # 真有两个 migrate 并发（比如手动又跑了一次），run_migrations 里有
  # MySQL GET_LOCK 排队，不会同时执行。
  # ------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # app.config 在 import 时就会校验 JWT 和 LLM 必填项，所以这里得把
      # backend 需要的变量都带上，哪怕迁移本身只用 DATABASE_URL。
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/lab_agent?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?根目录 .env 里没填 JWT_SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY:?根目录 .env 里没填 LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:?根目录 .env 里没填 LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL:?根目录 .env 里没填 LLM_BASE_URL}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["python", "-m", "app.migrate"]

  # ------------------------------------------------------------
  # 后端
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      # pip 源透传进构建。不填就用 Dockerfile 里的官方源默认值；
      # 在国内服务器上构建时，在根目录 .env 里指到镜像源（见 .env.example），
      # 否则官方 PyPI 连不上、PyTorch 源只有十几 KB/s。
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    depends_on:
      mysql:
        # 等到 healthcheck 通过才启动，不是"容器起来了"就算
        condition: service_healthy
      migrate:
        # 迁移成功退出后 backend 才启动。失败（退出码非 0）时 backend 不会起来，
        # `docker compose up` 会明确报错，而不是带着半截表结构硬跑。
        condition: service_completed_successfully
      redis:
        # 只等它"启动"，不等 healthy。
        #
        # 运行期：Redis 之后挂掉不影响后端，限流退回进程内存继续生效（见 app/limiter.py）。
        # 部署时：这仍然是**硬依赖**——Redis 容器起不来的话 `up` 会整体报错退出，
        # 新的 backend 不会换上去（旧容器继续跑，看着像更新成功了）。
        # 所以新增镜像要先在服务器上拉好，见 README「代码改完之后怎么更新线上」。
        condition: service_started
    environment:
      # 容器之间用**服务名**互找，所以主机名写 mysql，不是 127.0.0.1
      # —— 容器里的 127.0.0.1 指的是后端容器自己，那儿没有数据库。
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/lab_agent?charset=utf8mb4

      # 密钥一律从根目录 .env 注入环境变量，**不写进镜像**
      # （镜像层会被永久保存，推上去等于公开密钥）。
      # 后端 config.py 里有启动自检：长度不足 32 位、或用 .env.example 里的
      # 示例值，会直接拒绝启动 —— 所以照抄 .env.example 是起不来的，必须自己生成一个。
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?根目录 .env 里没填 JWT_SECRET_KEY}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}

      LLM_API_KEY: ${LLM_API_KEY:?根目录 .env 里没填 LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:?根目录 .env 里没填 LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL:?根目录 .env 里没填 LLM_BASE_URL}

      # 前后端同源（都在 8080，nginx 反代），浏览器不发跨域请求，
      # 所以这里留空完全没问题。开发时本机 npm run dev 才需要它。
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # 限流计数放 Redis：多进程/多实例共用一份，重启容器也不清零。
      # Redis 挂了后端照常跑，限流退回进程内存继续生效（见 backend/app/limiter.py）。
      # 容器之间用服务名互找，所以主机名是 redis，不是 127.0.0.1。
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # 邮箱验证码 + 预约结果通知。不填 SMTP_HOST/USER/PASSWORD 就是关掉的，其它登录和站内消息照常。
      # SMTP_PASSWORD 是 QQ 邮箱的 SMTP 授权码，不是 QQ 登录密码。
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-智能实验室预约系统}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      EMAIL_CODE_EXPIRE_MINUTES: ${EMAIL_CODE_EXPIRE_MINUTES:-5}
      EMAIL_CODE_COOLDOWN_SECONDS: ${EMAIL_CODE_COOLDOWN_SECONDS:-60}
      EMAIL_CODE_MAX_ATTEMPTS: ${EMAIL_CODE_MAX_ATTEMPTS:-5}

      # 迁移已经由上面的 migrate 服务跑过了，backend 启动时不要再跑一遍。
      AUTO_MIGRATE: "false"

      # 错误监控（Sentry）。DSN 留空就完全关闭，不影响运行。
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

      # 必须和后端 Dockerfile 里那个 ARG TZ 一致，否则改了这边不生效
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 用户上传的文件属于运行时数据，容器重建不该丢
      - uploads:/app/uploads
      # embedding 模型缓存。第一次启动会去 HuggingFace 下 BAAI/bge-small-zh-v1.5
      # （约 92MB），之后就一直用这份，不再联网。
      # 默认落在仓库根的 ./.hf-cache/（已被 .gitignore 忽略）。
      # 如果你本机已经下过这个模型，在 .env 里写
      #   HF_CACHE_DIR=C:/Users/你的用户名/.cache/huggingface
      # 指过去，就能省掉那一次下载。
      # 注意这个挂载是**必须**的：不挂的话每次都从头下，而且断网就起不来。
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
    ports:
      # 只在宿主机开 8001 用来排查（curl 直连后端看原始响应）。
      # 特意避开 8000 —— 那是本机 uvicorn 开发服务占的口。
      # 正常访问走 8080，由 nginx 转进来，不需要这个口。
      - "127.0.0.1:8001:8000"

  # ------------------------------------------------------------
  # 前端（nginx：发静态文件 + 反代 /api 和 /uploads 给后端）
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 用 8080 不用 80，免得跟本机别的东西撞。开 http://localhost:8080
      - "8080:80"

volumes:
  # 具名卷，docker compose down 不会删（down -v 才删）
  mysql-data:
  uploads:
