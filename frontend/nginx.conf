# ============================================================
# 容器的 nginx 配置，挂在 /etc/nginx/conf.d/default.conf
# 干两件事：发前端静态文件 + 把接口转给后端容器
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 传大文件（上传附件最大 100MB，见后端 config.py 的 MAX_FILE_SIZE）。
    # nginx 默认只让过 1MB，不改这里，上传会收到 413，而且前端拿到的是
    # nginx 的 HTML 错误页而不是后端的 JSON，报错信息会很难懂。
    client_max_body_size 100m;

    # ------------------------------------------------------------
    # 接口反代给后端
    #
    # ^~ 是必须的：不写的话，下面那条静态资源的正则 location
    # （\.(js|css|...)$）会抢在它前面命中，/api/xxx.json 之类的请求
    # 就会被当成静态文件找、找不到直接 404，永远到不了后端。
    # ------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://backend:8000;

        # 容器之间用 compose 里的服务名互找，"backend" 就是上面那个服务。
        # 名字必须在 compose 里对得上，改了一边另一边就 502。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # X-Forwarded-For 用**覆盖**，不是 $proxy_add_x_forwarded_for（追加）。
        #
        # 追加的写法是"访客带的头 + nginx 看到的地址"，而 uvicorn 取的是
        # "从右往左第一个不属于可信来源的地址"。两者一凑就有个洞：
        # 连接来源如果正好落在可信网段里（Docker Desktop 上宿主机来的请求就是这样，
        # 进到容器里已经变成网桥网关 172.18.0.1），那一步会被跳过，
        # 取到的就是**访客自己伪造的那个**——限流随手就能绕过。
        # 实测过：伪造 7 个不同 IP，7 次全部放行、日志里记的就是伪造值。
        #
        # 覆盖写法把访客带的一律丢掉，只写 nginx 亲眼看到的地址，伪造无从谈起。
        # 失效方向也是安全的：前面再挂代理/CDN 时，这里会退化成"大家都算成代理的地址"
        # （限流变严、不会失效），那时补 nginx 的 real_ip 配置即可：
        #   set_real_ip_from <CDN 网段>;  real_ip_header CF-Connecting-IP;
        # real_ip 会改写 $remote_addr，下面这行不用动。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 下面这几行是 AI 流式回答（SSE）能不能用的关键 ----
        # nginx 默认会把上游响应缓冲起来攒够一块再吐给浏览器。
        # 开了缓冲，打字机效果就没了，变成"转半天圈然后整段蹦出来"。
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 默认 60 秒。大模型流式回答慢的时候能跑好几分钟，
        # 不改的话会在中途被 nginx 掐断，用户看到"回答到一半停了"。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 后端 /uploads 下面的静态文件（用户上传的图片、附件）
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------
    # 前端路由
    #
    # 前端用的是 history 模式。直接访问 /lab/3 或在这种页面上按 F5 时，
    # 请求会先到 nginx，而磁盘上并没有 /lab/3 这个文件。
    # 不写 try_files 兜底就是 404 —— 这就是"刷新一下页面就白了"的成因。
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物的文件名里带内容哈希，内容一变文件名就变，
    # 所以可以放心让浏览器长缓存，不用怕拿到旧的。
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
